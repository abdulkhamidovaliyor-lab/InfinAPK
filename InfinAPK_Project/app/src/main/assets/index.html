<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Infin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#app{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0}
#pinDots{
  position:absolute;
  left:34.9%;
  top:54.5%;
  width:34.7%;
  height:3%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.dot{
  width:26px;
  height:26px;
  border-radius:50%;
  background:transparent;
}

.dot.on{
  background:#17365f;
}.pinKey{position:absolute;width:21%;height:9%;border:0;background:transparent}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
let pin="";
function screen(n){
  app.innerHTML='';
  const s=document.createElement('div'); s.className='screen';
  const img=document.createElement('img'); img.src=`screen${n}.png`; s.appendChild(img);
  app.appendChild(s);
  if(n===1) pinScreen(s);
  if([2,3,4,5].includes(n)) tabs(s,n);
  if(n===5){
    hot(s,57,42.5,91,7,()=>screen(6)); // 10 025 000 row
  }
  if(n===6){
    hot(s,2,5,14,7,()=>screen(5));     // back
    hot(s,0,42.8,100,8.8,()=>screen(7)); // receipt
    hot(s,4,86.2,92,6.5,()=>screen(2)); // home
  }
  if(n===7){
    hot(s,86,51,12,7,()=>screen(6));    // X
  }
}
function hot(parent,x,y,w,h,fn){
  const b=document.createElement('button'); b.className='hot';
  Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});
  b.onclick=fn; parent.appendChild(b);
}
function tabs(s,n){
  // fixed bottom navigation zones, matching baked-in bar
  const y=86.0,h=14;
  hot(s,0,y,25,h,()=>screen(2));
  hot(s,25,y,25,h,()=>screen(3));
  hot(s,50,y,25,h,()=>screen(4));
  hot(s,75,y,25,h,()=>screen(5));
}
function pinScreen(s){
  pin="";
 const dots=document.createElement('div');
dots.id='pinDots';

for(let i=0;i<4;i++){
  const d=document.createElement('div');
  d.className='dot';
  dots.appendChild(d);
}

s.appendChild(dots);
  // keypad coordinates based on supplied 540x1230 image
  const keys=[
    ['1',17,57],['2',41,57],['3',65,57],
    ['4',17,67],['5',41,67],['6',65,67],
    ['7',17,77],['8',41,77],['9',65,77],
    ['del',17,87],['0',41,87]
  ];
  keys.forEach(([v,x,y])=>{
    const b=document.createElement('button');b.className='pinKey';
    b.style.left=x+'%';b.style.top=y+'%';
    b.onclick=()=>press(v);s.appendChild(b);
  });
}
function press(v){
  if(v==='del') pin=pin.slice(0,-1);
  else if(pin.length<4) pin+=v;
  [...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i<pin.length));
  if(pin.length===4){
    if(pin==='0000') setTimeout(()=>screen(2),120);
    else setTimeout(()=>{pin="";[...document.querySelectorAll('.dot')].forEach(d=>d.classList.remove('on'))},250);
  }
}
window.addEventListener('load',()=>screen(1));
</script></body></html>
